name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, licences, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: web
      - name: SPDX headers
        run: node scripts/check-spdx.mjs
      - name: Licence check (AGPL-3.0 compatible, THIRD_PARTY_LICENSES up to date)
        run: node scripts/check-licenses.mjs --check
      - name: Type check (server)
        run: npm run typecheck
        working-directory: server
      - name: Type check (web)
        run: npm run check
        working-directory: web
      - name: Unit and integration tests
        run: npm test
        working-directory: server
      - name: Build
        run: npm run build && cd ../server && npm run build
        working-directory: web

  e2e-immich:
    name: End-to-end against Immich (Docker)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start Immich (latest release, without machine learning)
        working-directory: test-e2e
        run: |
          # GitHub downloads sometimes fail with 5xx: retry a few times
          dl() { curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 20 -o "$1" "$2"; }
          dl docker-compose.yml https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
          dl .env https://github.com/immich-app/immich/releases/latest/download/example.env
          mkdir -p library postgres
          docker compose up -d immich-server database redis
      - run: npm ci
        working-directory: server
      - name: Run Fotodruck and the end-to-end test
        working-directory: server
        env:
          IMMICH_URL: http://localhost:2283
        run: node --import tsx test/e2e/immich-e2e.ts
      - name: Immich logs
        if: failure()
        working-directory: test-e2e
        # only if Immich got that far; without its compose file docker compose would pick up ours
        run: |
          if [ -f docker-compose.yml ]; then docker compose -f docker-compose.yml logs immich-server | tail -200; else echo "Immich was not started."; fi

  image:
    name: Docker image (amd64, arm64) – GHCR and Docker Hub
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    env:
      # Docker Hub is used when the repository secrets DOCKERHUB_USERNAME and
      # DOCKERHUB_TOKEN exist. The image name defaults to <user>/foto-print-tool
      # and can be changed with the repository variable DOCKERHUB_IMAGE.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/foto-print-tool', secrets.DOCKERHUB_USERNAME) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image names
        id: images
        run: |
          {
            echo 'list<<EOF'
            echo "ghcr.io/${GITHUB_REPOSITORY,,}"
            if [ -n "$DOCKERHUB_USERNAME" ]; then echo "docker.io/${DOCKERHUB_IMAGE,,}"; fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::notice::Docker Hub skipped: secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set."
          fi
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=sha
      - name: Version
        id: version
        run: echo "version=$(node -p "require('./server/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Docker Hub description from README
        if: env.DOCKERHUB_USERNAME != '' && github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: Fotos auf Standardformate einpassen, speichern und drucken – optional mit Immich
          readme-filepath: ./README.md

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [check, image]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
