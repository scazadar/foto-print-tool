name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, licences, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: web
      - name: SPDX headers
        run: node scripts/check-spdx.mjs
      - name: Licence check (AGPL-3.0 compatible, THIRD_PARTY_LICENSES up to date)
        run: node scripts/check-licenses.mjs --check
      - name: Type check (server)
        run: npm run typecheck
        working-directory: server
      - name: Type check (web)
        run: npm run check
        working-directory: web
      - name: Unit and integration tests
        run: npm test
        working-directory: server
      - name: Build
        run: npm run build && cd ../server && npm run build
        working-directory: web

  e2e-immich:
    name: End-to-end against Immich (Docker)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start Immich (latest release, without machine learning)
        working-directory: test-e2e
        run: |
          curl -fsSL -o docker-compose.yml https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
          curl -fsSL -o .env https://github.com/immich-app/immich/releases/latest/download/example.env
          mkdir -p library postgres
          docker compose up -d immich-server database redis
      - run: npm ci
        working-directory: server
      - name: Run Fotodruck and the end-to-end test
        working-directory: server
        env:
          IMMICH_URL: http://localhost:2283
        run: node --import tsx test/e2e/immich-e2e.ts
      - name: Immich logs
        if: failure()
        working-directory: test-e2e
        run: docker compose logs immich-server | tail -200

  image:
    name: Docker image (amd64, arm64)
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=sha
      - name: Version
        id: version
        run: echo "version=$(node -p "require('./server/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [check, image]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
