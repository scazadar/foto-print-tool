name: Idee / Feature request
description: Vorschlag für eine neue Funktion oder Verbesserung.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem soll gelöst werden?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Wie könnte die Lösung aussehen?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativen
